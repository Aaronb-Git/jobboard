services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE:?Copy .env.example to .env first}
      DB_USER: ${MARIADB_USER:?Copy .env.example to .env first}
      DB_PASSWORD: ${MARIADB_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Copy .env.example to .env first}
      MARIADB_USER: ${MARIADB_USER:?Copy .env.example to .env first}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Copy .env.example to .env first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  backend_node_modules:
  mariadb_data:
